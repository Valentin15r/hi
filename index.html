<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Змейка</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --snake: #2ecc71;
    --apple: #e74c3c;
    --border: #333;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    /* отключаем вертикальные свайпы / pull-to-refresh */
    overscroll-behavior: none;
    touch-action: none;
    position: fixed;
    width: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(92vw, 92vh, 480px);
    padding: 8px 4px;
    font-size: 14px;
    opacity: 0.85;
  }

  #score { font-weight: 600; }

  #canvas-wrap {
    position: relative;
    width: min(92vw, 92vh, 480px);
    aspect-ratio: 1 / 1;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 10px;
    image-rendering: pixelated;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.78);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
    transition: opacity 0.2s;
  }

  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #overlay h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
  }

  #overlay p {
    margin: 0;
    font-size: 14px;
    opacity: 0.8;
    line-height: 1.4;
  }

  button {
    background: var(--snake);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, filter 0.1s;
  }

  button:active {
    transform: scale(0.96);
    filter: brightness(0.9);
  }

  #hint {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.55;
    text-align: center;
    max-width: min(92vw, 480px);
    line-height: 1.4;
  }

  /* Автоопределение светлой темы Telegram */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f5;
      --fg: #111;
      --border: #ccc;
    }
    canvas { background: #fff; }
    #overlay { background: rgba(255, 255, 255, 0.85); }
  }
</style>
</head>
<body>

<div id="hud">
  <span>🐍 Змейка</span>
  <span id="score">Счёт: 0</span>
</div>

<div id="canvas-wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h1>Змейка</h1>
    <p>Свайпай по экрану или используй стрелки / WASD</p>
    <button id="startBtn">Играть</button>
  </div>
</div>

<div id="hint">Управление: свайпы • стрелки • WASD</div>

<script>
(function () {
  'use strict';

  // === DOM ===
  const canvas = document.getElementById('game');
  const context = canvas.getContext('2d', { alpha: false });
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const overlayTitle = overlay.querySelector('h1');
  const overlayText = overlay.querySelector('p');
  const startBtn = document.getElementById('startBtn');

  const grid = 16;
  const cellsCount = canvas.width / grid;
  const W = canvas.width;
  const H = canvas.height;

  // === Цвета (кэш, без getComputedStyle в цикле) ===
  let COLOR_SNAKE = '#2ecc71';
  let COLOR_APPLE = '#e74c3c';

  // === Состояние игры ===
  let running = false;
  let score = 0;
  let rafId = null;
  let lastTime = 0;
  const FRAME_INTERVAL = 1000 / 15; // 15 FPS

  const snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
  const apple = { x: 320, y: 320 };

  function getRandomInt(min, max) {
    return (Math.random() * (max - min) + min) | 0;
  }

  function placeApple() {
    let attempts = 0;
    for (;;) {
      apple.x = getRandomInt(0, cellsCount) * grid;
      apple.y = getRandomInt(0, cellsCount) * grid;
      let hit = false;
      for (let i = 0; i < snake.cells.length; i++) {
        const c = snake.cells[i];
        if (c.x === apple.x && c.y === apple.y) { hit = true; break; }
      }
      if (!hit || ++attempts > 500) return;
    }
  }

  function resetGame() {
    snake.x = 160; snake.y = 160;
    snake.dx = grid; snake.dy = 0;
    snake.cells.length = 0;
    snake.maxCells = 4;
    score = 0;
    scoreEl.textContent = 'Счёт: 0';
    placeApple();
  }

  function gameOver() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    overlayTitle.textContent = 'Игра окончена';
    overlayText.textContent = 'Твой счёт: ' + score;
    startBtn.textContent = 'Играть снова';
    overlay.classList.remove('hidden');
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!running) return;
    if (now - lastTime < FRAME_INTERVAL) return;
    lastTime = now;

    context.clearRect(0, 0, W, H);

    snake.x += snake.dx;
    snake.y += snake.dy;

    if (snake.x < 0) snake.x = W - grid;
    else if (snake.x >= W) snake.x = 0;
    if (snake.y < 0) snake.y = H - grid;
    else if (snake.y >= H) snake.y = 0;

    snake.cells.unshift({ x: snake.x, y: snake.y });
    if (snake.cells.length > snake.maxCells) snake.cells.pop();

    // Яблоко
    context.fillStyle = COLOR_APPLE;
    context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

    // Змейка
    context.fillStyle = COLOR_SNAKE;
    const cells = snake.cells;
    const len = cells.length;

    for (let i = 0; i < len; i++) {
      const cell = cells[i];
      context.fillRect(cell.x, cell.y, grid - 1, grid - 1);

      if (cell.x === apple.x && cell.y === apple.y) {
        snake.maxCells++;
        score++;
        scoreEl.textContent = 'Счёт: ' + score;
        placeApple();
      }

      for (let j = i + 1; j < len; j++) {
        if (cell.x === cells[j].x && cell.y === cells[j].y) {
          gameOver();
          return;
        }
      }
    }
  }

  function startGame() {
    resetGame();
    overlay.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  // === Управление ===
  function setDirection(dir) {
    if (!running) return;
    if (dir === 'left' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
    else if (dir === 'up' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
    else if (dir === 'right' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
    else if (dir === 'down' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
  }

  document.addEventListener('keydown', function (e) {
    const k = e.key ? e.key.toLowerCase() : '';
    const c = e.which;
    if (c === 37 || k === 'a' || k === 'ф') setDirection('left');
    else if (c === 38 || k === 'w' || k === 'ц') setDirection('up');
    else if (c === 39 || k === 'd' || k === 'в') setDirection('right');
    else if (c === 40 || k === 's' || k === 'ы') setDirection('down');
    else if (k === ' ' && !running) startGame();
    if (c >= 37 && c <= 40) e.preventDefault();
  }, { passive: false });

  // Свайпы
  let tStartX = 0, tStartY = 0, tStartT = 0;
  const SWIPE = 24, MAX_T = 600;

  canvas.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    tStartX = t.clientX; tStartY = t.clientY; tStartT = Date.now();
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - tStartX;
    const dy = t.clientY - tStartY;
    if (Date.now() - tStartT > MAX_T) return;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < SWIPE) return;
    if (ax > ay) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  startBtn.addEventListener('click', startGame);

  // === Тема: берём цвета из CSS один раз ===
  function refreshColors() {
    const cs = getComputedStyle(document.documentElement);
    COLOR_SNAKE = cs.getPropertyValue('--snake').trim() || '#2ecc71';
    COLOR_APPLE = cs.getPropertyValue('--apple').trim() || '#e74c3c';
  }
  refreshColors();

  // Статичный первый рендер
  context.fillStyle = COLOR_APPLE;
  context.fillRect(apple.x, apple.y, grid - 1, grid - 1);
  context.fillStyle = COLOR_SNAKE;
  context.fillRect(160, 160, grid - 1, grid - 1);
})();
</script>

</body>
</html>
